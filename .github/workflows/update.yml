name: Update Bilibili Fans Data

on:
  schedule:
    - cron: '10,40 * * * *'   # 每30分钟运行一次
  workflow_dispatch:          # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'   # 缓存 pip 依赖，命中后跳过安装

      - name: Install dependencies
        run: pip install -r requirements.txt

      # update.py 会复制 public/ 静态资源到 build/，并把生成的 HTML 写入 build/
      - name: Run update script
        run: python update.py

      # 只把粉丝历史 data.json 提交回 main 分支；build/ 已被 .gitignore 忽略
      - name: Commit and push history data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update fans data"
          git push

      # 将生成的 build/ 部署为站点（gh-pages 分支）
      - name: Deploy build to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
